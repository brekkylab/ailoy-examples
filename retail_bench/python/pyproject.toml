[project]
name = "ailoy-example-retail-bench"
version = "0.1.0"
description = "RetailBench run against an agent, one day a turn, on ailoy's Python bindings."
requires-python = ">=3.11"
dependencies = ["ailoy-py>=0.3.3,<0.4", "virtx>=0.2.1,<0.3", "python-dotenv>=1"]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false
