[project]
name = "ailoy-example-sam3"
version = "0.1.0"
description = "SAM3 on ncnn as an agent's skill, on ailoy's Python bindings, and the script that downloads and converts its checkpoint."
# The same bound as ../shared/pyproject.toml, which says why.
requires-python = ">=3.11,<3.15"
dependencies = [
    "ailoy-py",
    "virtx>=0.2.0,<0.3",
    "huggingface_hub",
    "ncnn",
    "numpy",
    "pillow",
    "pnnx",
    "python-dotenv>=1",
    "torch",
    "torchvision",
    "transformers",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false

[tool.uv.sources]
# Until the next ailoy release: the bindings in the ailoy checkout beside this repository,
# built by maturin on the first `uv run`. `scripts/pin_ailoy.py` swaps this for a release.
ailoy-py = { path = "../../../ailoy/bindings/python", editable = true }
