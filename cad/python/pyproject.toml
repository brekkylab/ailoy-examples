[project]
name = "ailoy-example-cad"
version = "0.1.0"
description = "Parts designed in CadQuery by an agent that looks at what it built, on ailoy's Python bindings."
requires-python = ">=3.11"
dependencies = ["ailoy-py", "virtx>=0.2.0,<0.3", "python-dotenv>=1"]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false

[tool.uv.sources]
# Until the next ailoy release: the bindings in the ailoy checkout beside this repository,
# built by maturin on the first `uv run`. `scripts/pin_ailoy.py` swaps this for a release.
ailoy-py = { path = "../../../ailoy/bindings/python", editable = true }
